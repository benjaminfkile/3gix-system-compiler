[package]
name = "system-compiler"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The system module: compiles a planetary system into 3GIX matter, a frame registry at the origin and per-body density fields."

[lib]
name = "system_compiler"
path = "src/lib.rs"
# `cdylib` is the WebAssembly module; `rlib` is what the CLI and the tests
# link.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "system-compiler"
path = "src/main.rs"

[dependencies]
# Without default features: the library's own C ABI and wasm-bindgen
# exports would bring imports into the module (core docs/modules.md).
gx-core = { git = "https://github.com/benjaminfkile/3gix-core", branch = "grunt", default-features = false }
gx-module-guest = { git = "https://github.com/benjaminfkile/3gix-core", branch = "grunt" }
serde = { version = "1", features = ["derive"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
thiserror = "2"

# The native CLI only. The module build (`--lib --target
# wasm32-unknown-unknown`) never compiles these.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
toml = "0.8"
serde_json = "1.0.151"
