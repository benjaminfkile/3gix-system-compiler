# The planetary system this compiler bakes into matter.
#
# This is the only place numbers live. Every value is SI (meters, kilograms,
# seconds, kelvin) except the IAU rotational elements, which keep the IAU
# report's degrees and degrees per day and are converted to radians and
# radians per second in code (crates/system-compiler/src/rotation.rs).
# Every source, request, and conversion is recorded in docs/data-sources.md.
#
# Conventions:
# - Masses are GM / G with G = 6.67430e-11 m^3 kg^-1 s^-2 (CODATA 2018, the
#   value gx_core::gravity::G uses). GM values are from the NAIF kernel
#   gm_de440.tpc (DE440 values), quoted in km^3/s^2 on each body.
# - State vectors are JPL Horizons geometric states at 2000-01-01 12:00:00 TDB
#   (JD 2451545.0 TDB), ICRF axes, km and km/s multiplied by 1000. The Sun
#   and the planets are relative to the system barycenter (@0, the root
#   frame); the Moon is relative to the Earth's center (@399).
# - Rotational elements are the IAU WGCCRE values from the NAIF kernel
#   pck00011.tpc, evaluated at J2000 (d = 0, T = 0) with every periodic term
#   included (scripts/iau-at-epoch.py).
# - sidereal_orbit_period_s is a published check value, never compiled: the
#   tests compare it with the period derived from the state vectors.
# - root_extent_m is 8 * mean_radius_m for every body frame; max_depth is 6.

[epoch]
# Seconds of Barycentric Dynamical Time since J2000 (2000-01-01 12:00:00 TDB).
tdb_seconds_since_j2000 = 0.0

[root]
# The system barycenter: a massless coordinate origin (Horizons center @0).
frame_id = 0
name = "Solar system barycenter"
# Massless: the barycenter is a point, not a body.
mass_kg = 0.0
# A cube of edge 2.0e13 m centered on the barycenter: half edge 1.0e13 m is
# more than twice the Neptune aphelion distance (about 4.54e12 m).
root_extent_m = 2.0e13
# No matter is compiled in the root frame itself.
max_depth = 0


[[body]]
frame_id = 1
# The system barycenter (root).
parent_frame_id = 0
# Compiler-side only; never emitted.
name = "Sun"
# BODY10_GM = 1.3271244004127942E+11 km^3/s^2 (NAIF gm_de440.tpc); GM * 1e9 / 6.67430e-11.
mass_kg = 1.988409871316534e30
# Horizons physical data for target 10: 'Vol. mean radius, km = 695700' (IAU 2015 nominal solar radius).
mean_radius_m = 6.957e8
# Horizons COMMAND='10' CENTER='@0', X Y Z in km times 1000.
position_m = [-1.067706805380953e9, -3.960361847959462e8, -1.380651842868809e8]
# Horizons COMMAND='10' CENTER='@0', VX VY VZ in km/s times 1000.
velocity_m_per_s = [9.312571926520472e0, -1.170150612817771e1, -5.251266205200356e0]
# Pole and prime meridian: IAU WGCCRE 2015 report, as BODY10_POLE_RA,
# BODY10_POLE_DEC, and BODY10_PM in pck00011.tpc, evaluated at J2000.
pole_ra_deg = 286.13
pole_dec_deg = 63.87
prime_meridian_deg = 84.176
rotation_rate_deg_per_day = 14.1844
state = "plasma"
# Horizons physical data for target 10: 'Effective temp, K = 5772'.
temperature_k = 5772.0
# Bands long to short wavelength. Tint: a hot emitter: albedo 0 in every band, so emissivity is 1 and it radiates as a blackbody.
albedo = [0.0, 0.0, 0.0]
roughness = 1.0
# Chosen so attenuation * mean density * 0.01 * mean radius >= 10: opaque
# within one percent of the radius (asserted in tests/data.rs).
attenuation_m2_per_kg = 1e-08
# 8 * mean_radius_m.
root_extent_m = 5.5656e9
max_depth = 6

